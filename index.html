<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>БРАТЬЯ ПО ОРУЖИЮ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#293625;
}

#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  display:block;
  touch-action:none;
}

/* =========================
   ВЕРХ
========================= */

#top{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:72px;
  z-index:10;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px 14px;

  background:linear-gradient(
    to bottom,
    rgba(8,10,8,.96),
    rgba(8,10,8,.72),
    transparent
  );

  pointer-events:none;
}

.title{
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}

.objective{
  margin-top:5px;
  color:#d0bd75;
  font-size:12px;
}

#timer{
  font-size:17px;
  font-weight:bold;
}

/* =========================
   СООБЩЕНИЕ
========================= */

#message{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%);

  z-index:30;

  padding:9px 15px;

  background:rgba(12,15,12,.94);
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;

  font-size:12px;
  white-space:nowrap;

  opacity:0;
  transition:.2s;

  pointer-events:none;
}

#message.show{
  opacity:1;
}

/* =========================
   ПОДСКАЗКА
========================= */

#hint{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);

  z-index:15;

  width:min(330px,85%);
  padding:15px;

  text-align:center;

  background:rgba(8,11,8,.9);
  border:1px solid rgba(255,255,255,.15);
  border-radius:8px;

  font-size:12px;
  line-height:1.6;

  pointer-events:none;

  transition:opacity 1s;
}

#hint.hide{
  opacity:0;
}

/* =========================
   НИЖНЯЯ ПАНЕЛЬ
========================= */

#bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  z-index:20;

  padding:8px 8px 10px;

  background:linear-gradient(
    to bottom,
    transparent,
    rgba(5,8,5,.78) 12%,
    rgba(5,8,5,.97)
  );

  pointer-events:auto;
}

/* =========================
   ОТРЯД
========================= */

#squad{
  width:100%;

  display:flex;
  gap:7px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:16px 2px 7px;

  scrollbar-width:none;

  pointer-events:auto;
}

#squad::-webkit-scrollbar{
  display:none;
}

.soldierCard{
  flex:0 0 108px;

  min-height:59px;

  padding:7px;

  background:#182018;
  border:1px solid rgba(255,255,255,.16);
  border-radius:7px;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;

  pointer-events:auto;
}

.soldierCard.selected{
  border-color:#d8c46a;
  box-shadow:0 0 12px rgba(216,196,106,.2);
  background:#292b1b;
}

.soldierCard.dead{
  opacity:.32;
  filter:grayscale(1);
}

.soldierName{
  font-size:12px;
  font-weight:bold;
}

.soldierWeapon{
  margin-top:2px;
  color:#aaa;
  font-size:9px;
}

.hp{
  height:5px;
  margin-top:6px;

  background:#351919;
  border-radius:5px;

  overflow:hidden;
}

.hp i{
  display:block;
  height:100%;
  background:#719552;
}

/* =========================
   КНОПКИ
========================= */

#buttons{
  display:flex;
  justify-content:center;
  gap:6px;

  pointer-events:auto;
}

.actionBtn{
  flex:1;

  min-width:0;

  padding:12px 5px;

  background:#202920;
  color:#eee;

  border:1px solid rgba(255,255,255,.16);
  border-radius:6px;

  font-size:10px;
  font-weight:bold;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  pointer-events:auto;
}

.actionBtn.active{
  background:#66592d;
  border-color:#d1bb60;
}

.actionBtn:active{
  transform:scale(.96);
}

/* =========================
   ЭКРАН КОНЦА
========================= */

#endScreen{
  position:absolute;
  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(3,5,3,.93);

  padding:20px;
}

.endBox{
  width:min(420px,100%);

  padding:28px 20px;

  text-align:center;

  background:#151b15;
  border:1px solid rgba(255,255,255,.16);
  border-radius:9px;
}

.endBox h1{
  margin:0 0 10px;

  font-size:22px;
  letter-spacing:2px;
}

.endBox p{
  margin:0 0 20px;

  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

#restart{
  width:100%;
  padding:13px;

  border:0;
  border-radius:6px;

  background:#675b30;
  color:white;

  font-weight:bold;
  cursor:pointer;
}

/* =========================
   МОБИЛЬНАЯ АДАПТАЦИЯ
========================= */

@media(max-width:600px){

  #top{
    height:64px;
  }

  .title{
    font-size:14px;
  }

  .objective{
    font-size:10px;
  }

  #timer{
    font-size:14px;
  }

  .soldierCard{
    flex-basis:96px;
  }

  .actionBtn{
    font-size:9px;
    padding:12px 2px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- ВЕРХ -->
<div id="top">

  <div>
    <div class="title">БРАТЬЯ ПО ОРУЖИЮ</div>

    <div class="objective">
      Задача: захватить деревню
    </div>
  </div>

  <div id="timer">
    00:00
  </div>

</div>

<!-- СООБЩЕНИЯ -->
<div id="message"></div>

<!-- ПОДСКАЗКА -->
<div id="hint">
  <b>ПЕРВАЯ ОПЕРАЦИЯ</b><br>
  Выберите бойца снизу.<br>
  Нажмите на карту, чтобы отправить его.<br>
  Для стрельбы выберите «ОГОНЬ».
</div>

<!-- НИЗ -->
<div id="bottom">

  <div id="squad"></div>

  <div id="buttons">

    <button class="actionBtn active" id="moveBtn">
      ДВИЖЕНИЕ
    </button>

    <button class="actionBtn" id="fireBtn">
      ОГОНЬ
    </button>

    <button class="actionBtn" id="grenadeBtn">
      ГРАНАТА
    </button>

    <button class="actionBtn" id="coverBtn">
      УКРЫТИЕ
    </button>

  </div>

</div>

<!-- КОНЕЦ -->
<div id="endScreen">

  <div class="endBox">

    <h1 id="endTitle">
      МИССИЯ ЗАВЕРШЕНА
    </h1>

    <p id="endText"></p>

    <button id="restart">
      НАЧАТЬ ЗАНОВО
    </button>

  </div>

</div>

<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W;
  canvas.height=H;
}

window.addEventListener("resize",resize);
resize();


/* =====================================================
   МИР
===================================================== */

const world={
  width:1200,
  height:760
};

let camera={
  x:0,
  y:0
};


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let selected=0;
let mode="move";

let gameOver=false;
let elapsed=0;

let lastTime=performance.now();


/* =====================================================
   СОЛДАТЫ
===================================================== */

const soldiers=[

  {
    name:"ИВАН",
    role:"Командир",
    weapon:"ППШ",
    x:145,
    y:520,
    tx:145,
    ty:520,
    hp:100,
    maxHp:100,
    speed:115,
    range:300,
    damage:20,
    cooldown:0,
    grenades:2,
    cover:false,
    alive:true
  },

  {
    name:"МИХАИЛ",
    role:"Стрелок",
    weapon:"МОСИН",
    x:95,
    y:560,
    tx:95,
    ty:560,
    hp:100,
    maxHp:100,
    speed:95,
    range:390,
    damage:38,
    cooldown:0,
    grenades:1,
    cover:false,
    alive:true
  },

  {
    name:"АЛЕКСЕЙ",
    role:"ПУЛЕМЁТЧИК",
    weapon:"ДП-27",
    x:205,
    y:570,
    tx:205,
    ty:570,
    hp:100,
    maxHp:100,
    speed:82,
    range:330,
    damage:11,
    cooldown:0,
    grenades:1,
    cover:false,
    alive:true
  },

  {
    name:"ПЁТР",
    role:"ГРЕНАДЕР",
    weapon:"ППШ",
    x:80,
    y:505,
    tx:80,
    ty:505,
    hp:100,
    maxHp:100,
    speed:105,
    range:270,
    damage:21,
    cooldown:0,
    grenades:3,
    cover:false,
    alive:true
  },

  {
    name:"СЕРГЕЙ",
    role:"СТРЕЛОК",
    weapon:"МОСИН",
    x:260,
    y:515,
    tx:260,
    ty:515,
    hp:100,
    maxHp:100,
    speed:95,
    range:390,
    damage:38,
    cooldown:0,
    grenades:1,
    cover:false,
    alive:true
  },

  {
    name:"НИКОЛАЙ",
    role:"АВТОМАТЧИК",
    weapon:"ППШ",
    x:175,
    y:595,
    tx:175,
    ty:595,
    hp:100,
    maxHp:100,
    speed:110,
    range:290,
    damage:18,
    cooldown:0,
    grenades:2,
    cover:false,
    alive:true
  }

];


/* =====================================================
   ВРАГИ
===================================================== */

const enemies=[

  {
    x:850,y:205,
    hp:100,maxHp:100,
    type:"rifle",
    cooldown:1,
    alive:true
  },

  {
    x:950,y:250,
    hp:100,maxHp:100,
    type:"rifle",
    cooldown:1.5,
    alive:true
  },

  {
    x:780,y:330,
    hp:100,maxHp:100,
    type:"rifle",
    cooldown:1,
    alive:true
  },

  {
    x:1030,y:390,
    hp:100,maxHp:100,
    type:"mg",
    cooldown:1,
    alive:true
  },

  {
    x:900,y:470,
    hp:100,maxHp:100,
    type:"rifle",
    cooldown:1.3,
    alive:true
  },

  {
    x:740,y:455,
    hp:100,maxHp:100,
    type:"rifle",
    cooldown:1,
    alive:true
  }

];


/* =====================================================
   КАРТА
===================================================== */

const houses=[

  {
    x:470,
    y:100,
    w:230,
    h:145
  },

  {
    x:790,
    y:100,
    w:200,
    h:145
  },

  {
    x:540,
    y:390,
    w:205,
    h:145
  }

];

const walls=[

  {
    x:340,
    y:300,
    w:190,
    h:25
  },

  {
    x:800,
    y:340,
    w:210,
    h:25
  },

  {
    x:350,
    y:625,
    w:260,
    h:24
  }

];

const trees=[

  [420,80],
  [455,70],
  [510,70],
  [1030,80],
  [1080,120],
  [1050,170],
  [300,120],
  [330,80],
  [1040,570],
  [1080,620],
  [980,650],
  [420,530],
  [350,510],
  [300,570],
  [680,650],
  [720,680]

];


/* =====================================================
   ПУЛИ
===================================================== */

let bullets=[];


/* =====================================================
   ВЗРЫВЫ
===================================================== */

let explosions=[];


/* =====================================================
   УТИЛИТЫ
===================================================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function aliveEnemies(){

  return enemies.filter(e=>e.alive);

}


function aliveSoldiers(){

  return soldiers.filter(s=>s.alive);

}


function message(text){

  const el=document.getElementById("message");

  el.textContent=text;

  el.classList.add("show");

  clearTimeout(message.timer);

  message.timer=setTimeout(()=>{
    el.classList.remove("show");
  },1600);

}


/* =====================================================
   UI ОТРЯДА
===================================================== */

function updateSquad(){

  const box=document.getElementById("squad");

  box.innerHTML="";

  soldiers.forEach((s,index)=>{

    const card=document.createElement("div");

    card.className="soldierCard";

    if(index===selected){
      card.classList.add("selected");
    }

    if(!s.alive){
      card.classList.add("dead");
    }

    card.innerHTML=`

      <div class="soldierName">
        ${s.name}
      </div>

      <div class="soldierWeapon">
        ${s.role} · ${s.weapon}
      </div>

      <div class="hp">
        <i style="width:${s.hp}%"></i>
      </div>

    `;

    card.addEventListener("pointerdown",function(e){

      e.preventDefault();
      e.stopPropagation();

      selectSoldier(index);

    });

    box.appendChild(card);

  });

}


function selectSoldier(index){

  if(!soldiers[index].alive){

    message("Боец погиб");

    return;
  }

  selected=index;

  updateSquad();

  message(
    soldiers[index].name+
    " — "+
    soldiers[index].role
  );

}


/* =====================================================
   РЕЖИМЫ
===================================================== */

function setMode(newMode){

  mode=newMode;

  document.querySelectorAll(".actionBtn")
    .forEach(b=>b.classList.remove("active"));

  if(mode==="move"){
    document
      .getElementById("moveBtn")
      .classList.add("active");
  }

  if(mode==="fire"){
    document
      .getElementById("fireBtn")
      .classList.add("active");
  }

  if(mode==="grenade"){
    document
      .getElementById("grenadeBtn")
      .classList.add("active");
  }

  if(mode==="cover"){
    document
      .getElementById("coverBtn")
      .classList.add("active");
  }

}


/* =====================================================
   КНОПКИ
===================================================== */

function button(id,fn){

  const el=document.getElementById(id);

  el.addEventListener("pointerdown",function(e){

    e.preventDefault();
    e.stopPropagation();

    fn();

  });

}


button("moveBtn",()=>{
  setMode("move");
  message("Режим движения");
});


button("fireBtn",()=>{
  setMode("fire");
  message("Выберите врага");
});


button("grenadeBtn",()=>{
  setMode("grenade");
  message("Укажите место броска");
});


button("coverBtn",()=>{

  const s=soldiers[selected];

  if(!s.alive)return;

  s.cover=!s.cover;

  if(s.cover){
    message("Боец занял укрытие");
  }else{
    message("Укрытие покинуто");
  }

});


/* =====================================================
   КООРДИНАТЫ КАРТЫ
===================================================== */

function screenToWorld(clientX,clientY){

  const rect=canvas.getBoundingClientRect();

  const sx=world.width/W;
  const sy=world.height/H;

  return {

    x:clientX/sx+camera.x,
    y:clientY/sy+camera.y

  };

}


/* =====================================================
   КЛИК ПО КАРТЕ
===================================================== */

canvas.addEventListener("pointerdown",function(e){

  if(gameOver)return;

  e.preventDefault();

  const p=screenToWorld(
    e.clientX,
    e.clientY
  );

  const s=soldiers[selected];

  if(!s || !s.alive)return;


  /* ДВИЖЕНИЕ */

  if(mode==="move"){

    s.tx=p.x;
    s.ty=p.y;

    s.cover=false;

    message(
      s.name+
      " движется"
    );

    return;
  }


  /* УКРЫТИЕ */

  if(mode==="cover"){

    s.tx=p.x;
    s.ty=p.y;
    s.cover=true;

    setMode("move");

    message(
      s.name+
      " занял позицию"
    );

    return;
  }


  /* ГРАНАТА */

  if(mode==="grenade"){

    throwGrenade(
      s,
      p.x,
      p.y
    );

    setMode("move");

    return;
  }


  /* ОГОНЬ */

  if(mode==="fire"){

    let target=null;

    for(const enemy of enemies){

      if(!enemy.alive)continue;

      if(
        Math.hypot(
          enemy.x-p.x,
          enemy.y-p.y
        )<35
      ){

        target=enemy;
        break;

      }

    }

    if(target){

      shoot(s,target);

    }else{

      message("Цель не найдена");

    }

  }

});


/* =====================================================
   СТРЕЛЬБА
===================================================== */

function shoot(s,target){

  if(s.cooldown>0)return;

  const d=distance(s,target);

  if(d>s.range){

    message("Слишком далеко");

    return;
  }

  s.cooldown=
    s.role==="ПУЛЕМЁТЧИК"
      ? .2
      : .6;

  target.hp-=s.damage;

  bullets.push({

    x:s.x,
    y:s.y,

    tx:target.x,
    ty:target.y,

    life:.12

  });

  if(target.hp<=0){

    target.hp=0;
    target.alive=false;

    message("Враг уничтожен");

    checkVictory();

  }

}


/* =====================================================
   ГРАНАТА
===================================================== */

function throwGrenade(s,x,y){

  if(s.grenades<=0){

    message("Нет гранат");

    return;
  }

  s.grenades--;

  explosions.push({

    x:x,
    y:y,

    radius:5,

    life:.55

  });

  enemies.forEach(enemy=>{

    if(!enemy.alive)return;

    const d=Math.hypot(
      enemy.x-x,
      enemy.y-y
    );

    if(d<100){

      enemy.hp-=
        90*
        Math.max(
          .15,
          1-d/110
        );

      if(enemy.hp<=0){

        enemy.hp=0;
        enemy.alive=false;

      }

    }

  });

  message("ГРАНАТА!");

  checkVictory();

}


/* =====================================================
   ИИ
===================================================== */

function updateEnemies(dt){

  for(const enemy of enemies){

    if(!enemy.alive)continue;

    enemy.cooldown-=dt;

    let target=null;
    let best=Infinity;

    for(const soldier of soldiers){

      if(!soldier.alive)continue;

      const d=distance(
        enemy,
        soldier
      );

      if(d<best){

        best=d;
        target=soldier;

      }

    }

    if(!target)continue;

    if(
      best<360 &&
      enemy.cooldown<=0
    ){

      enemy.cooldown=
        enemy.type==="mg"
        ? .32
        : 1.1;

      let damage=
        enemy.type==="mg"
        ? 7
        : 13;

      if(target.cover){

        damage*=.45;

      }

      target.hp-=damage;

      bullets.push({

        x:enemy.x,
        y:enemy.y,

        tx:target.x,
        ty:target.y,

        life:.12

      });

      if(target.hp<=0){

        target.hp=0;
        target.alive=false;

        message(
          target.name+
          " погиб"
        );

        chooseNext();

      }

    }

  }

}


function chooseNext(){

  if(
    soldiers[selected] &&
    soldiers[selected].alive
  ){
    return;
  }

  const next=soldiers.findIndex(
    s=>s.alive
  );

  if(next>=0){

    selected=next;

    updateSquad();

  }

}


/* =====================================================
   ДВИЖЕНИЕ
===================================================== */

function updateSoldiers(dt){

  for(const s of soldiers){

    if(!s.alive)continue;

    s.cooldown=
      Math.max(
        0,
        s.cooldown-dt
      );

    const dx=s.tx-s.x;
    const dy=s.ty-s.y;

    const d=Math.hypot(dx,dy);

    if(d>3){

      s.x+=
        dx/d*
        s.speed*
        dt;

      s.y+=
        dy/d*
        s.speed*
        dt;

    }

  }

}


/* =====================================================
   КАМЕРА
===================================================== */

function updateCamera(){

  const s=soldiers[selected];

  if(!s)return;

  const sx=W/world.width;
  const sy=H/world.height;

  camera.x=
    s.x-
    W/(2*sx);

  camera.y=
    s.y-
    H/(2*sy);

  camera.x=Math.max(
    0,
    Math.min(
      world.width-
      W/sx,
      camera.x
    )
  );

  camera.y=Math.max(
    0,
    Math.min(
      world.height-
      H/sy,
      camera.y
    )
  );

}


/* =====================================================
   РИСОВАНИЕ
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const sx=W/world.width;
  const sy=H/world.height;

  ctx.save();

  ctx.scale(sx,sy);

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /* ЗЕМЛЯ */

  ctx.fillStyle="#34442f";

  ctx.fillRect(
    0,
    0,
    world.width,
    world.height
  );


  /* ДОРОГИ */

  ctx.fillStyle="#625941";

  ctx.fillRect(
    0,
    335,
    world.width,
    90
  );

  ctx.fillRect(
    660,
    0,
    75,
    world.height
  );


  /* ТЕКСТУРА */

  ctx.fillStyle="#4b4b37";

  for(let i=0;i<70;i++){

    const x=
      (i*173)%world.width;

    const y=
      (i*97)%world.height;

    ctx.fillRect(
      x,
      y,
      18,
      5
    );

  }


  /* ДЕРЕВЬЯ */

  for(const t of trees){

    ctx.fillStyle="#162317";

    ctx.beginPath();

    ctx.arc(
      t[0],
      t[1],
      27,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#294028";

    ctx.beginPath();

    ctx.arc(
      t[0]-7,
      t[1]-8,
      20,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* ДОМА */

  for(const h of houses){

    ctx.fillStyle="#292923";

    ctx.fillRect(
      h.x,
      h.y,
      h.w,
      h.h
    );

    ctx.fillStyle="#3d3b31";

    ctx.fillRect(
      h.x+9,
      h.y+9,
      h.w-18,
      h.h-18
    );

    ctx.strokeStyle="#171815";

    ctx.lineWidth=6;

    ctx.strokeRect(
      h.x,
      h.y,
      h.w,
      h.h
    );

    /* дверь */

    ctx.fillStyle="#171814";

    ctx.fillRect(
      h.x+h.w/2-18,
      h.y+h.h-46,
      36,
      46
    );

    /* окна */

    ctx.fillStyle="#1c2420";

    ctx.fillRect(
      h.x+30,
      h.y+35,
      32,
      28
    );

    ctx.fillRect(
      h.x+h.w-62,
      h.y+35,
      32,
      28
    );

  }


  /* СТЕНЫ */

  for(const w of walls){

    ctx.fillStyle="#77705c";

    ctx.fillRect(
      w.x,
      w.y,
      w.w,
      w.h
    );

    ctx.strokeStyle="#3c392e";

    ctx.strokeRect(
      w.x,
      w.y,
      w.w,
      w.h
    );

  }


  /* ТОЧКИ ДВИЖЕНИЯ */

  const selectedSoldier=
    soldiers[selected];

  if(
    selectedSoldier &&
    selectedSoldier.alive
  ){

    ctx.strokeStyle="#d8c86c";

    ctx.lineWidth=2;

    ctx.setLineDash([
      7,
      7
    ]);

    ctx.beginPath();

    ctx.moveTo(
      selectedSoldier.x,
      selectedSoldier.y
    );

    ctx.lineTo(
      selectedSoldier.tx,
      selectedSoldier.ty
    );

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.beginPath();

    ctx.arc(
      selectedSoldier.tx,
      selectedSoldier.ty,
      9,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  /* ВРАГИ */

  for(const enemy of enemies){

    if(!enemy.alive)continue;

    ctx.fillStyle="#741f1f";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y,
      15,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* каска */

    ctx.fillStyle="#35221e";

    ctx.beginPath();

    ctx.arc(
      enemy.x,
      enemy.y-5,
      10,
      Math.PI,
      0
    );

    ctx.fill();

    /* здоровье */

    ctx.fillStyle="#401717";

    ctx.fillRect(
      enemy.x-18,
      enemy.y-27,
      36,
      4
    );

    ctx.fillStyle="#ae4b43";

    ctx.fillRect(
      enemy.x-18,
      enemy.y-27,
      36*
      (enemy.hp/enemy.maxHp),
      4
    );

  }


  /* СОЛДАТЫ */

  soldiers.forEach((s,index)=>{

    if(!s.alive)return;

    ctx.fillStyle=
      index===selected
      ? "#d6c35f"
      : "#71945e";

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      15,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* каска */

    ctx.fillStyle="#2c3a28";

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y-6,
      10,
      Math.PI,
      0
    );

    ctx.fill();

    /* укрытие */

    if(s.cover){

      ctx.strokeStyle="#d6c35f";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.arc(
        s.x,
        s.y,
        21,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }

    /* здоровье */

    ctx.fillStyle="#391818";

    ctx.fillRect(
      s.x-20,
      s.y-29,
      40,
      4
    );

    ctx.fillStyle="#729955";

    ctx.fillRect(
      s.x-20,
      s.y-29,
      40*
      (s.hp/s.maxHp),
      4
    );

    /* имя */

    ctx.fillStyle="#fff";

    ctx.font="bold 11px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      s.name,
      s.x,
      s.y+31
    );

  });


  /* ПУЛИ */

  for(const bullet of bullets){

    ctx.strokeStyle="#e9dc9d";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      bullet.x,
      bullet.y
    );

    ctx.lineTo(
      bullet.tx,
      bullet.ty
    );

    ctx.stroke();

  }


  /* ВЗРЫВЫ */

  for(const explosion of explosions){

    const r=
      explosion.radius;

    ctx.fillStyle=
      "rgba(220,165,50,.32)";

    ctx.beginPath();

    ctx.arc(
      explosion.x,
      explosion.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#f1cf73";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      explosion.x,
      explosion.y,
      r+7,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* =====================================================
   ПОБЕДА
===================================================== */

function checkVictory(){

  if(
    !gameOver &&
    aliveEnemies().length===0
  ){

    gameOver=true;

    document.getElementById(
      "endScreen"
    ).style.display="flex";

    document.getElementById(
      "endTitle"
    ).textContent=
      "МИССИЯ ЗАВЕРШЕНА";

    document.getElementById(
      "endText"
    ).textContent=
      "Деревня захвачена. Все вражеские подразделения уничтожены.";

  }

}


/* =====================================================
   ПОРАЖЕНИЕ
===================================================== */

function checkDefeat(){

  if(
    !gameOver &&
    aliveSoldiers().length===0
  ){

    gameOver=true;

    document.getElementById(
      "endScreen"
    ).style.display="flex";

    document.getElementById(
      "endTitle"
    ).textContent=
      "ОТРЯД УНИЧТОЖЕН";

    document.getElementById(
      "endText"
    ).textContent=
      "Задание провалено. Попробуйте снова.";

  }

}


/* =====================================================
   ТАЙМЕР
===================================================== */

function updateTimer(){

  const total=
    Math.floor(elapsed);

  const minutes=
    String(
      Math.floor(total/60)
    ).padStart(2,"0");

  const seconds=
    String(
      total%60
    ).padStart(2,"0");

  document.getElementById(
    "timer"
  ).textContent=
    minutes+":"+seconds;

}


/* =====================================================
   ПЕРЕЗАПУСК
===================================================== */

document
.getElementById("restart")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    location.reload();

  }
);


/* =====================================================
   КЛАВИАТУРА
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(e.key>="1" && e.key<="6"){

      selectSoldier(
        Number(e.key)-1
      );

    }

    if(
      e.key.toLowerCase()==="q"
    ){

      setMode("move");

    }

    if(
      e.key.toLowerCase()==="f"
    ){

      setMode("fire");

    }

    if(
      e.key.toLowerCase()==="g"
    ){

      setMode("grenade");

    }

  }
);


/* =====================================================
   GAME LOOP
===================================================== */

function loop(now){

  const dt=
    Math.min(
      .05,
      (now-lastTime)/1000
    );

  lastTime=now;

  if(!gameOver){

    elapsed+=dt;

    updateSoldiers(dt);

    updateEnemies(dt);

    updateCamera();

    bullets.forEach(
      b=>b.life-=dt
    );

    bullets=
      bullets.filter(
        b=>b.life>0
      );

    explosions.forEach(
      e=>{
        e.life-=dt;
        e.radius+=
          (85-e.radius)*
          dt*9;
      }
    );

    explosions=
      explosions.filter(
        e=>e.life>0
      );

    checkDefeat();

    updateTimer();

    updateSquad();

  }

  draw();

  requestAnimationFrame(loop);

}


/* =====================================================
   START
===================================================== */

updateSquad();

setTimeout(()=>{

  document
    .getElementById("hint")
    .classList.add("hide");

},5000);

requestAnimationFrame(loop);

</script>
